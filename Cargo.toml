[workspace]
resolver = "2"
members = ["crates/aegis-core", "crates/aegis-engine", "crates/rivus"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rivus contributors"]
repository = "https://github.com/227375488489/rivus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

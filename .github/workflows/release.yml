name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build Rivus
        run: cargo build --release -p rivus

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/rivus.exe release/rivus.exe
          $hash = (Get-FileHash release/rivus.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rivus.exe" | Set-Content -Encoding ascii release/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/rivus.exe
            release/SHA256SUMS
          generate_release_notes: true
